<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 863.2 861.58">
  <defs>
    <style>
      .cls-1 {
        fill: #e65125;
      }

      .cls-2 {
        fill: #848689;
        font-size: 26.29px;
      }

      .cls-2, .cls-3 {
        font-family: OmnesGeorgian-SemiBold, OmnesGeorgian;
