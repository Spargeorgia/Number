        fill: #231f20;
        font-size: 28.91px;
      }
    </style>
  </defs>
  <g id="Layer_2-2" data-name="Layer 2">
    <text class="cls-2" transform="translate(0 91.3)"><tspan x="0" y="0">“ტელეფონის ნომრის შეყვანითა და მოცემული ველის </tspan><tspan x="0" y="33.59">მონიშვნით ვაცხადებ თანხმობას, რომ შპს „რითეილ ჯგუფმა“ </tspan><tspan x="0" y="67.17">(ს/კ 436041659), პირდაპირი მარკეტინგის მიზნით დაამუშაოს </tspan><tspan x="0" y="100.76">ჩემი ტელეფონის ნომერი და თავად ან/და მისი დავალებით </tspan><tspan x="0" y="134.35">მოქმედი SMS მომსახურების მიმწოდებლის მეშვეობით </tspan><tspan x="0" y="167.93">გამომიგზავნოს სარეკლამო ან/და საინფორმაციო SMS </tspan><tspan x="0" y="201.52">შეტყობინებები კომპანიის, მისი ბრენდების (SPAR, Magniti, </tspan><tspan x="0" y="235.11" xml:space="preserve">Daily და Kalata)  ან/და პარტნიორი კომპანიების შესახებ, </tspan><tspan x="0" y="268.7">რომლებიც ოპერირებენ სავაჭრო ნიშნით “SPAR”. </tspan><tspan x="0" y="302.28">ინფორმირებული ვარ, რომ შემიძლია ნებისმიერ დროს, </tspan><tspan x="0" y="335.87">უფასოდ და ყოველგვარი მიზეზის მითითების გარეშე, </tspan><tspan x="0" y="369.46">გამოვიხმო აღნიშნული თანხმობა და უარი ვთქვა SMS </tspan><tspan x="0" y="403.04">შეტყობინებების მიღებაზე, SMS-ში მითითებული უარის </tspan><tspan x="0" y="436.63">თქმის მექანიზმის გამოყენებით”.</tspan></text>
    <g>
      <text class="cls-3" transform="translate(21.96 23.81)"><tspan x="0" y="0">თანხმობა პერსონალური მონაცემების დამუშავებაზე</tspan></text>
      <path class="cls-1" d="M18.4,15.09l-5.82,1.81,3.65,4.8-2.27,1.67-3.5-4.95-3.55,5-2.17-1.71,3.6-4.8-5.77-1.81.84-2.6,5.72,1.96-.05-6.03h2.76l-.1,6.03,5.77-1.96.89,2.6Z"/>
    </g>
  </g>
</svg>