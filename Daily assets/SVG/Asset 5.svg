  <g id="Layer_1-2" data-name="Layer 1">
    <text class="cls-1" transform="translate(0 86.13)"><tspan x="0" y="0">“ტელეფონის ნომრის შეყვანითა და მოცემული ველის </tspan><tspan x="0" y="41">მონიშვნით ვაცხადებ თანხმობას, რომ შპს „რითეილ </tspan><tspan x="0" y="82">ჯგუფმა“ (ს/კ 436041659), პირდაპირი მარკეტინგის მიზნით </tspan><tspan x="0" y="123">დაამუშაოს ჩემი ტელეფონის ნომერი და თავად ან/და მისი </tspan><tspan x="0" y="164">დავალებით მოქმედი SMS მომსახურების მიმწოდებლის </tspan><tspan x="0" y="205">მეშვეობით გამომიგზავნოს სარეკლამო ან/და </tspan><tspan x="0" y="246">საინფორმაციო SMS შეტყობინებები კომპანიის, მისი </tspan><tspan x="0" y="287">ბრენდების Daily ან/და პარტნიორი კომპანიების შესახებ, </tspan><tspan x="0" y="328">რომლებიც ოპერირებენ სავაჭრო ნიშნით “SPAR”. </tspan><tspan x="0" y="369">ინფორმირებული ვარ, რომ შემიძლია ნებისმიერ დროს, </tspan><tspan x="0" y="410">უფასოდ და ყოველგვარი მიზეზის მითითების გარეშე, </tspan><tspan x="0" y="451">გამოვიხმო აღნიშნული თანხმობა და უარი ვთქვა SMS </tspan><tspan x="0" y="492">შეტყობინებების მიღებაზე, SMS-ში მითითებული უარის </tspan><tspan x="0" y="533">თქმის მექანიზმის გამოყენებით”.</tspan></text>
    <g>
      <text class="cls-2" transform="translate(40.41 25.63)"><tspan x="0" y="0">ᲗᲐᲜᲮᲛᲝᲑᲐ ᲞᲔᲠᲡᲝᲜᲐᲚᲣᲠᲘ ᲛᲝᲜᲐᲪᲔᲛᲔᲑᲘᲡ ᲓᲐᲛᲣᲨᲐᲕᲔᲑᲐᲖᲔ</tspan></text>
